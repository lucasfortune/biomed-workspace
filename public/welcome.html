<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomedical Image Processing Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="css/welcome.css">
</head>
<body>
    <!-- Logo Row: Top-right corner -->
    <div class="logo-row">
        <a href="https://www.uni-wuerzburg.de/forschung/physics-of-parasitism/"
           target="_blank" rel="noopener noreferrer" class="logo-link">
            <img src="imgs/pop_transpBG.svg" alt="Physics of Parasitism" class="logo">
        </a>
        <a href="https://www.dfg.de/"
           target="_blank" rel="noopener noreferrer" class="logo-link">
            <img src="imgs/dfg_transpBG.svg" alt="Deutsche Forschungsgemeinschaft" class="logo">
        </a>
    </div>

    <!-- Theme Toggle: Top-left corner -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <!-- Sun icon (shown in dark mode) -->
        <svg class="theme-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg class="theme-icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <!-- Main Container -->
    <main class="welcome-main">
        <!-- Header -->
        <header class="welcome-header">
            <h1>Biomedical image processing platform</h1>
            <p class="tagline">A complete web-based machine learning pipeline for biomedical image analysis</p>
        </header>

        <!-- Auth Container (shown when NOT authenticated) -->
        <div class="auth-container" id="authContainer">
            <!-- Tab Navigation -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Register</button>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="loginForm" data-form="login">
                <div id="loginError" class="error-message"></div>

                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <!-- Register Form (hidden by default) -->
            <form class="auth-form hidden" id="registerForm" data-form="register">
                <div id="registerError" class="error-message"></div>
                <div id="registerSuccess" class="success-message"></div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="registerUsername">Username</label>
                        <input type="text" id="registerUsername" name="username" required
                               pattern="[a-zA-Z0-9_]{3,20}" autocomplete="username">
                        <small>3-20 characters, alphanumeric and underscore</small>
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" name="email" required autocomplete="email">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" name="password" required
                               minlength="8" autocomplete="new-password">
                        <small>Minimum 8 characters</small>
                    </div>

                    <div class="form-group">
                        <label for="registerConfirmPassword">Confirm Password</label>
                        <input type="password" id="registerConfirmPassword" name="confirmPassword" required
                               minlength="8" autocomplete="new-password">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="registerFullName">Full Name</label>
                        <input type="text" id="registerFullName" name="fullName" required autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="registerInstitution">Institution</label>
                        <input type="text" id="registerInstitution" name="institution" required autocomplete="organization">
                    </div>
                </div>

                <button type="submit" class="btn-primary">Register</button>
            </form>
        </div>

        <!-- Authenticated Container (shown when authenticated) -->
        <div class="authenticated-container hidden" id="authenticatedContainer">
            <p class="welcome-user">Welcome back, <span id="userName"></span></p>
            <a href="/workspace" class="btn-primary btn-launch">Launch Workspace</a>
            <button class="btn-logout" id="logoutBtn">Logout</button>
            <a href="/admin" class="admin-link hidden" id="adminLink">Admin Dashboard</a>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loadingText">Processing...</p>
        </div>
    </div>

    <script src="js/welcome.js"></script>
</body>
</html>
