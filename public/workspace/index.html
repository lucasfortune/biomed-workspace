<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biomedical Image Processing Workspace</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Workspace CSS -->
  <link rel="stylesheet" href="/workspace/css/workspace.css">
  <link rel="stylesheet" href="/workspace/css/info-panel.css">

  <!-- External Libraries (CDN) -->
  <script src="https://unpkg.com/mitt@3.0.0/dist/mitt.umd.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <!-- split.js loaded when needed in Phase 3 -->
</head>
<body>
  <div id="workspace-container">
    <!-- Collapsible Sidebar -->
    <aside id="sidebar" class="sidebar collapsed">
      <div class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">
        <span class="toggle-icon">☰</span>
      </div>

      <div class="sidebar-content">
        <!-- User Info Section -->
        <div class="sidebar-section user-info">
          <div class="user-avatar">
            <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
          <div class="user-details">
            <div class="user-name" id="user-name">Loading...</div>
            <div class="user-status" id="user-status"></div>
          </div>
        </div>

        <!-- Workspace Stats -->
        <div class="sidebar-section workspace-stats">
          <h3>Workspace</h3>
          <div class="stat-item">
            <span class="stat-label">Files:</span>
            <span class="stat-value" id="file-count">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Size:</span>
            <span class="stat-value" id="workspace-size">0 MB</span>
          </div>
        </div>

        <!-- File Browser (placeholder for Phase 3) -->
        <div class="sidebar-section file-browser">
          <div id="file-tree-container">
            <p class="empty-state">File browser coming in Phase 3</p>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="sidebar-section quick-actions">
          <div class="quick-actions-row">
            <button class="btn-action" onclick="workspace.returnToHub()">
              Back to Hub
            </button>
            <button id="theme-toggle" class="theme-toggle" title="Toggle dark/light mode">
              <svg class="sun-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
              <svg class="moon-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2c-1.05 0-2.05.16-3 .46 4.06 1.27 7 5.06 7 9.54 0 4.48-2.94 8.27-7 9.54.95.3 1.95.46 3 .46 5.52 0 10-4.48 10-10S14.52 2 9 2z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main id="main-content">
      <!-- Welcome/Hub View -->
      <div id="welcome-view" class="view active">
        <div class="welcome-container">
          <header class="welcome-header">
            <h1>Biomedical Image Processing Workspace</h1>
            <p class="subtitle">Select a processing module to begin</p>
          </header>

          <!-- Module Cards Grid -->
          <div id="modules-grid" class="modules-grid">
            <!-- Modules will be dynamically rendered here -->
          </div>

          <!-- Resources Section -->
          <footer class="welcome-footer">
            <div class="resources">
              <h4>Resources</h4>
              <a href="https://github.com/lucasfortune/viz_app" class="resource-link" target="_blank">
                GitHub Repository
              </a>

            </div>

            <div class="workspace-info">
              <small>Workspace Version 1.0.0</small>
            </div>

            <!-- Partner Logos -->
            <div class="partner-logos">
              <a href="https://www.physics-of-parasitism.org/" target="_blank" rel="noopener noreferrer" title="Physics of Parasitism">
                <img src="/imgs/pop_transpBG.svg" alt="Physics of Parasitism Logo" class="logo-pop">
              </a>
              <a href="https://www.dfg.de/" target="_blank" rel="noopener noreferrer" title="Deutsche Forschungsgemeinschaft">
                <img src="/imgs/dfg_transpBG.svg" alt="DFG Logo" class="logo-dfg">
              </a>
            </div>
          </footer>
        </div>
      </div>

      <!-- Module View -->
      <div id="module-view" class="view">
        <!-- Active module content will be rendered here -->
      </div>
    </main>

    <!-- Info Panel (Right Side) -->
    <aside id="info-panel" class="ip-panel collapsed">
      <div class="ip-toggle" id="info-panel-toggle" title="Toggle help panel">
        <!-- Help icon SVG per ADR-005 -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
        </svg>
      </div>
      <div class="ip-content">
        <div id="info-panel-container">
          <!-- InfoPanel component renders here -->
        </div>
      </div>
    </aside>
  </div>

  <!-- Notification Container -->
  <div id="notification-container" class="notification-container"></div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="loading-spinner"></div>
    <p class="loading-text">Loading...</p>
  </div>

  <!-- Core JavaScript Modules -->
  <script src="/workspace/js/core/StateManager.js"></script>
  <script src="/workspace/js/core/ModuleLoader.js"></script>
  <script src="/workspace/js/core/WorkspaceAPI.js"></script>
  <script src="/workspace/js/components/ContextMenu.js"></script>
  <script src="/workspace/js/components/FileBrowser.js"></script>
  <script src="/workspace/js/services/InfoContentService.js"></script>
  <script src="/workspace/js/core/components/InfoArticle.js"></script>
  <script src="/workspace/js/core/components/InfoSearch.js"></script>
  <script src="/workspace/js/core/components/InfoGlossary.js"></script>
  <script src="/workspace/js/core/components/InfoPanel.js"></script>
  <script src="/workspace/js/modules/registry.js"></script>
  <script src="/workspace/js/workspace.js"></script>
</body>
</html>
