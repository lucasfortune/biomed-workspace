[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoStructN2V"
version = "0.1.0"
description = "Two-stage deep learning pipeline for microscopy image denoising"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.9.0",
    "numpy>=1.19.0",
    "tifffile>=2021.0.0",
    "scikit-image>=0.18.0",
    "tensorboard>=2.4.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["autoStructN2V*"]
